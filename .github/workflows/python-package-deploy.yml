---
# Inspired from:
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Publish to PyPI and Anaconda

on:
  push:
    branches: [main, develop]
    tags: ['v*', '*.*.*']
jobs:
  build-n-publish:
    name: Publish to PyPI and Anaconda
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: "0"
    - name: Set version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
        else
          # Dev builds for TestPyPI / legacy LCA channel only; not published to PyPI
          VERSION="0.1.0.dev$(git rev-list --count HEAD)"
        fi
        echo "BW_FUNCTIONAL_VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "Using version ${VERSION}"
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --outdir dist/
        .
    - name: Publish distribution 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
    - name: Publish distribution 📦 to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: false
    - name: Set up Conda 3.11
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.11
        activate-environment: build
        environment-file: .github/environments/build.yml
    # DEPRECATED: Private LCA Anaconda channel upload. Prefer conda-forge once the
    # feedstock is live. Kept temporarily so existing LCA-channel users keep working.
    - name: Build a Conda tarbal
      run: |
        conda build -c conda-forge -c cmutel ./recipe/
    - name: Publish to Anaconda (deprecated; use conda-forge)
      run: |
        anaconda -t ${{ secrets.CONDA_LCA }} upload \
        /usr/share/miniconda/envs/build/conda-bld/noarch/*.conda
