# Legacy recipe for the private LCA Anaconda channel only (deprecated).
# Use ../conda-forge/bw_functional for staged-recipes / conda-forge.
{% set version = environ.get("BW_FUNCTIONAL_VERSION", "dev") %}

package:
  name: bw_functional
  version: "{{ version }}"

source:
  path: ..

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  script_env:
    - BW_FUNCTIONAL_VERSION

requirements:
  host:
    - python
    - pip
  build:
    - setuptools
  run:
    - python >=3.10
    - blinker
    - loguru
    - pandas
    - bw2data >=4.0.1
    - bw2io >=0.9.1
    - bw_processing >=0.9.6
